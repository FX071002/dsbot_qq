# 独立模式：直接跑官方构建好的镜像，不需要 Harness、不需要 clone 代码。
#
#   docker compose up -d
#
# 用浏览器打开 http://<你的地址>:9999/ ，出厂账号与密码均为 harness（登录后强制修改）。
# 端口想换就改下面的映射，例如 18000:9999，容器内部固定 9999。
#
# 升级：docker compose pull && docker compose up -d
services:
  qqbot:
    image: ghcr.io/fx071002/dsbot_qq:latest
    container_name: qqbot
    restart: always
    ports:
      - "9999:9999"          # 控制台（公网部署请自行加反代与 HTTPS）
    environment:
      # 在 .env 文件里写这两项，或直接填在这里
      QQ_BOT_APP_ID: "${QQ_BOT_APP_ID:?请设置 QQ_BOT_APP_ID}"
      QQ_BOT_APP_SECRET: "${QQ_BOT_APP_SECRET:?请设置 QQ_BOT_APP_SECRET}"
      # 控制台出厂账号是 harness / harness（登录框下方也有提示），
      # 首次登录后会被强制改成自己的账号密码；也可以用下面两项预设初始账号。
      # QQBOT_AUTH_USER: "harness"
      # QQBOT_AUTH_PASSWORD: "harness"
      TZ: "Asia/Shanghai"
    volumes:
      - qqbot-data:/data/qqbot
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9999/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 60s
      timeout: 5s
      retries: 3

volumes:
  qqbot-data:
